<style>

    --water: #5b93ff;

    --gravel: #b3aea4;
    --block: #8a8f9c;

    --jello: #ff3d70;
    --fire: #ff8a2e;
    --sand: #dbb86f;
    --powder: #7a7883;
    --merc: #cfd6e3;
    --dirt: #8f6237;
    --mud: #6b5230;
    --snow: #e6edfb;
    --ice: #8ed1f7;

  * { box-sizing: border-box; }

<script>
"use strict";
// CPU reference engine — mirrors the GPU passes exactly (Jacobi / gather-only).
// Units: smoothing radius h = 1 = one grid cell.  Velocities stored implicitly as (x - prev) per step.
const TM = 31;   // type mask: five bits, so the table has room past gravel and steam
const T_DEAD = 0, T_WATER = 1, T_OIL = 2, T_GRAVEL = 3, T_FIRE = 4, T_NITRO = 5, T_JELLO = 6, T_LAVA = 7,

// Fictional material tuning. Heat uses the existing unit-radius neighbor stencil.
const MELTDOWN_BLAST = 10000.0, MELTDOWN_PRESSURE = 0.35, MELTDOWN_CHANCE = 0.02;
const MELTDOWN_REACH = 0.95, MELTDOWN_THERMAL = 24.0;
const MELTDOWN_HEAT = 5.0, MELTDOWN_MELT = 0.045, MELTDOWN_MUTATE = 0.045;
const MELTDOWN_LIFE_CHANCE = 0.00001; // One rare roll per contacting jelly particle, independent of neighbor count.
const A_FROZEN = 1 << 5; // an unused state bit; genome and vitality remain intact
// Clone: an anchored ice-like solid. Bits 16-20 hold the material it was programmed with (0 = blank).
// Each exposed clone emits at most once per CLONE_PERIOD steps into a free neighboring spot; the whole
// world is further capped at CLONE_FRAME_MAX emissions per rendered frame (CPU: a quarter per step) and
// cloning pauses once live particles reach CLONE_FILL of capacity, so a clone can never flood the sim.
const CLONE_PERIOD = 24, CLONE_FRAME_MAX = 32, CLONE_FILL = 0.75, CLONE_REACH = 0.8, CLONE_GAP = 0.5;
const CLONE_DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
const cloneProg = a => (a >>> 16) & 31;
const cloneable = t => t !== 0 && t !== T_CLONE && t !== T_LIFE && t !== T_CARGO && t !== T_SEED;
// Hot phases start hot enough to stay molten/vaporized instead of instantly condensing.
const cloneAttr = (t, shade) => (t | ((shade & 255) << 8) | (t === T_MOLTEN_STEEL ? 1580 << 16 : t === T_MERC_VAPOR ? 2800 << 16 : 0)) >>> 0;
// ---- life ----------------------------------------------------------------
// A life particle spends its attribute word differently from dead matter: the byte that is a
// random shade seed elsewhere holds the appearance genome, the age field holds vitality, and
// the top byte packs separate behaviour and organelle clauses.  Two particles are the same organism exactly when
// their sixteen genome bits match, which is all "self" means here.
//   bits 8-12: appearance; bits 13,14,15: thermophile, radiophile, roller organelles.
//   bits 16-23  vitality 0-255, spent on upkeep and refilled by eating
//   bits 24-31: behaviour clause (0,1,3,4,5,7); organelles (2=chemophile,6=predator).
// Nine independent organelle bits: all 512 combinations fit the existing 16-bit genome.
// Former cosmetic bits 9-12 are the rare clause: rigid, jellyfish, acid defense, plantlike.
// Organelle presence is binary and inherited; its expressed size follows stored fuel.
// Life particles ARE the stabilizing cytoplasm. Only surface particles form membrane bonds.
// Jelly is the universal food currency. Rare defense flags do not change oil buoyancy.
const geneA = a => (a >>> 8) & 255, geneB = a => (a >>> 24) & 0xBB;

const UNKNOWN_GENOME = 0xFFFF, UNKNOWN_CHANCE = 0.001, UNKNOWN_DIGEST = 240;
// Reserved whole-genome signature: independent ordinary organelle combinations remain valid.
const isUnknown = a => (a & TM) === T_LIFE && genome(a) === UNKNOWN_GENOME;
const A_APPEND = 64; // Life reuses the sleep flag for flexible appendages / roots.
const RARE_MASK = 0x001E; // New clause: four formerly cosmetic bits, independent of all five original organelles.
const THERMO_FOOD = 0.16, THERMO_SHED = 0.0003, RADIO_RESIST = 0.02;
const organelles = a => isUnknown(a) ? O_UNKNOWN : ((a >>> 26) & 1) | (((a >>> 30) & 1) << 1) | (((a >>> 13) & 7) << 2) | (((a >>> 9) & 15) << 5);
const genome = a => ((a >>> 8) & 255) | (((a >>> 24) & 255) << 8);
const vitOf = a => (a >>> 16) & 255;
const withVit = (a, v) => (a & ~(255 << 16)) | (Math.max(0, Math.min(255, v | 0)) << 16);
const mkLife = (g, v) => T_LIFE | ((g & 255) << 8) | ((Math.min(255, v) | 0) << 16) | (((g >>> 8) & 255) << 24);
const B_MOTILE = 1, B_BUOY = 2, B_HARDY = 8, B_CRYO = 16, B_THICK = 32, B_FECUND = 128;
const isLife = t => t === T_LIFE;
const membraneStrength = a => isUnknown(a) ? 24 : (organelles(a) & O_RIGID ? 12 : 1) + (geneB(a) & B_THICK ? 1.0 : 0) + (geneB(a) & B_HARDY ? 0.35 : 0);
const divThresh = (a, P) => P.lifeDiv * (geneB(a) & B_FECUND ? 0.78 : 1);
// Rank-four compatibility: jelly, mud, prey, chemical fuel. The organelle clause
// contributes two binary receptors; no per-substance decision network.
// The vitality threshold and exact self identity remain outside this factorization.
const LIFE_LIGAND = new Uint8Array(32); LIFE_LIGAND[T_JELLO] = 1; LIFE_LIGAND[T_MUD] = 2; LIFE_LIGAND[T_LIFE] = 4;
LIFE_LIGAND[T_OIL] = LIFE_LIGAND[T_NITRO] = LIFE_LIGAND[T_POWDER] = 8;
function lifeReceptors(a) {
  if ((a & TM) !== T_LIFE || (a & A_FROZEN)) return 0;
  const b = geneB(a);
  const o = organelles(a);
  return 1 | ((b & B_HARDY) && (o & O_PRED) ? 2 : 0) | (o & O_PRED ? 4 : 0) | (o & O_CHEM ? 8 : 0);
}
function receptorGate(receptors, a, b) {
  if (isUnknown(b)) return 0;
  if (isUnknown(a)) return (b & TM) ? 1 : 0;
  if (b & A_FROZEN) return 0;
  const channel = receptors & LIFE_LIGAND[b & TM];
  if (channel === 1) return 1;
  if (channel === 2) return 0.35;
  if (channel === 8) return (b & A_LIT) ? 0 : 0.85;
  return channel === 4 && !(organelles(b)&O_RIGID) && genome(a) !== genome(b) && vitOf(a) + 25 > vitOf(b) * membraneStrength(b) * 0.60 ? 0.75 : 0;
}
function lifeGate(a, b) { return receptorGate(lifeReceptors(a), a, b); }
// Cache the rank-two surface feature in eight unused PID bits; no new GPU buffer.
// [1, s_i] dot [.25 + .75*s_j, .75] = .25 + .75*(s_i + s_j).
// Only s is quantized (nearest 1/255). Geometry, bonds and ingestion remain exact.
const LIFE_SURF_MASK = 0xF0F00000;
const lifeSurface = p => (((p >>> 20) & 15) | ((p >>> 24) & 240)) / 255;
const withSurface = (p, s) => { const q = Math.round(Math.min(1, s) * 255); return (p & ~LIFE_SURF_MASK) | ((q & 15) << 20) | ((q & 240) << 24); };
// Absorbed material stays a separate particle: original colour/type, remaining fraction,
// and a seven-tick membrane-entry phase. Three existing bond slots retain host PID,
// original attribute, and host genome. No new per-particle allocation or compute pass.
const CARGO_TAG = 0xFFFFFFFE;
const cargoPhase = a => a >>> 29;
const cargoType = a => (a >>> 24) & 31;
const cargoFraction = a => vitOf(a) / 255;
// Entry and digestion change the parcel's amount, not its chemical identity.
const nitroIgnites = (a, heat) => heat > 0 && ((a & TM) === T_NITRO ||
  ((a & TM) === T_CARGO && cargoType(a) === T_NITRO && vitOf(a) > 0));
const mkCargo = (original, remaining = 255, phase = 7) => T_CARGO | (original & 0xFF00) | (remaining << 16) | ((original & TM) << 24) | (phase << 29);
const withCargoPhase = (a, phase) => (a & 0x1FFFFFFF) | (phase << 29);
const lifeFuel = (a, P) => (a & TM) === T_OIL ? P.lifeDigest * 3 :
  (a & TM) === T_POWDER ? P.lifeDigest * 4 : (a & TM) === T_NITRO ? P.lifeDigest * 5 :
  (a & TM) === T_LIFE || (a & TM) === T_JELLO ? P.lifeDigest : P.lifeMud;
const deadJelly = a => (a & 0xFF00) | T_JELLO;
function bioHash(a, b) {
  const pcg = v => { const k = (Math.imul(v, 747796405) + 2891336453) >>> 0;
    const w = Math.imul((k >>> ((k >>> 28) + 4)) ^ k, 277803737) >>> 0; return ((w >>> 22) ^ w) >>> 0; };

}
// Share the same independent trait probabilities with spontaneous life in the GPU shader.
const GENOME_TRAITS = [[0x0100,.70],[0x0400,.30],[0x4000,.25],[0x0020,.25],[0x0040,.20],[0x0080,.30],[2,.06],[4,.05],[8,.04],[16,.05]];
// About 70% of new strains inherit the stronger membrane stroke.
function randomGenome(random = Math.random) {
  if (random() < UNKNOWN_CHANCE) return UNKNOWN_GENOME;
  let g = Math.floor(random() * 65536) & 0xBA01;
  for(const [bit,chance]of GENOME_TRAITS)if(random()<chance)g|=bit;
  return g === UNKNOWN_GENOME ? g ^ 1 : g;

function originGenome(id, clock) { let stream=6101;return randomGenome(()=>bioHash(id+stream++,clock)); }

    fillRect(7, 52, 27, 58, T_MERC, 0.42);          // mercury draws itself into beads
    fillRect(7, 66, 27, 72, T_DIRT, 0.52);          // dirt: wet it and it turns to mud
    fillCone(104, 25, 12, 0.9, T_SAND, 0.46);       // sand dune on the shelf over the basin
    fillRect(140, 22, 158, 32, T_POWDER, 0.5);      // gunpowder magazine, top right

  } else {

    fillRect(87.5, 88, 160, 100, T_WATER, sp);
    fillRect(87.5, 84, 160, 88, T_OIL, sp);
    fillCone(20, 45, 34, 0.95, T_GRAVEL, 0.64);
    fillCone(22, 100, 90, 0.8, T_GRAVEL, 0.64);
    fillRect(113.5, 33, 136.5, 36, T_NITRO, sp);
    fillRect(46, 75, 72, 78, T_LAVA, sp);
    fillRect(8, 18, 30, 24, T_SNOW, 0.52);
    fillRect(8, 53, 26, 58, T_MERC, 0.42);
    fillRect(8, 67, 26, 72, T_DIRT, 0.52);

}
function clearAll() { window.dispatchEvent(new Event('slurry-clear')); player.reset(); machines.clear(); epoch++; sim.clear(); occReset(); walls.fill(0); wallsDirty = true; }

// ---------- UI ----------
function refreshUI() {
  for (const t of TOOLS) { const b = $('t-' + t); b.classList.toggle('l', ui.toolL === t); b.classList.toggle('r', ui.toolR === t); }
  $('t-erase').setAttribute('aria-pressed', String(ui.toolL === 'erase'));
  $('pen-v').textContent = 'Pen ' + (ui.pen + 1);
  $('o-grav').innerHTML = 'Grav <em>' + GRAV[ui.grav][2] + '</em>';
  $('o-speed').innerHTML = 'Speed <em>' + SPEEDS[ui.speed][1] + '</em>';
  $('o-view').innerHTML = 'View <em>' + VIEWS[ui.view] + '</em>';
  $('o-run').textContent = ui.running ? 'Stop' : 'Start';
  $('o-run').classList.toggle('on', !ui.running);
  $('o-walls').innerHTML = 'Edge <em>' + (edgeOn ? 'On' : 'Off') + '</em>';
  $('paused').hidden = ui.running;
  if (sim && sim.wake) sim.wake();   // settings changed: nudge dozing cells
  PRM.gx = 0; PRM.gy = PRM_G * GRAV[ui.grav][1];
}
const PRM_G = PRM.gy;
for (const t of TOOLS) {
  const b = $('t-' + t);
  b.addEventListener('click', () => { ui.toolL = t; refreshUI(); });
  b.addEventListener('contextmenu', e => { e.preventDefault(); ui.toolR = t; refreshUI(); });
}
$('pen-dn').onclick = () => { ui.pen = Math.max(0, ui.pen - 1); refreshUI(); };
$('pen-up').onclick = () => { ui.pen = Math.min(PEN_R.length - 1, ui.pen + 1); refreshUI(); };
$('o-grav').onclick = () => { ui.grav = (ui.grav + 1) % GRAV.length; refreshUI(); };
$('o-speed').onclick = () => { ui.speed = (ui.speed + 1) % SPEEDS.length; refreshUI(); };
$('o-view').onclick = () => { ui.view = (ui.view + 1) % VIEWS.length; refreshUI(); };
$('o-run').onclick = () => { ui.running = !ui.running; refreshUI(); };
$('o-clear').onclick = () => clearAll();
$('o-walls').onclick = () => { edgeOn = !edgeOn; refreshUI(); };
window.addEventListener('keydown', e => {
  if(document.querySelector('dialog[open]')||e.ctrlKey||e.metaKey||e.altKey||(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]')))return;
  if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();player.keys.add(e.code);return;}
  if (e.key === ' ') { e.preventDefault(); ui.running = !ui.running; }
  else if (e.key === '[') ui.pen = Math.max(0, ui.pen - 1);
  else if (e.key === ']') ui.pen = Math.min(PEN_R.length - 1, ui.pen + 1);
  else if (e.key >= '1' && e.key <= '9') ui.toolL = TOOLS[+e.key - 1];
  else if (e.key === '0') ui.toolL = TOOLS[9];
  else if (KEYROW.includes(e.key.toLowerCase()) && e.key.length === 1) ui.toolL = TOOLS[10 + KEYROW.indexOf(e.key.toLowerCase())];
  else if (e.key === 'v' || e.key === 'V') ui.view = (ui.view + 1) % VIEWS.length;
  else if (e.key === 'g' || e.key === 'G') ui.grav = (ui.grav + 1) % GRAV.length;
  else return;
  refreshUI();
});

window.addEventListener('keyup',e=>{if(player.keys.delete(e.code))e.preventDefault();});
window.addEventListener('blur',()=>{player.keys.clear();ptr.down=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){player.keys.clear();ptr.down=false;}});

// pointer
function simXY(e) { const r = stage.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  [ptr.x, ptr.y] = simXY(e); ptr.down = true; ptr.fresh = true; ptr.btn = e.button === 2 ? 'R' : 'L'; ptr.inside = true;
  if (hintShown) { hintShown = false; showMsg(''); }
  e.preventDefault();
});
stage.addEventListener('pointermove', e => { [ptr.x, ptr.y] = simXY(e); ptr.inside = true; });
const up = () => { ptr.down = false; };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('pointerleave', () => { if (!ptr.down) ptr.inside = false; });
stage.addEventListener('wheel', e => { e.preventDefault(); ui.pen = Math.max(0, Math.min(PEN_R.length - 1, ui.pen + (e.deltaY > 0 ? -1 : 1))); refreshUI(); }, { passive: false });

// sizing
function layout() {
  const maxW = Math.min(1280, window.innerWidth - 32);
  const deckH = $('deck').offsetHeight + $('status').offsetHeight + 2;
  const byH = (window.innerHeight - 32 - deckH) * 1.6;
  const w = Math.max(300, Math.min(maxW, byH));
  $('rig').style.setProperty('--w', Math.floor(w) + 'px');
  const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const c of [view, overlay]) { c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr)); }
}
window.addEventListener('resize', layout);

function drawMachines(c,sx,sy){
  c.save();c.scale(sx,sy);c.lineCap='round';c.lineJoin='round';
  const wire=machines.wire,W=machines.w;
  for(let k=0;k<wire.length;k++)if(wire[k]){const x=k%W,y=Math.floor(k/W),n=machines.net[k],power=n>=0?machines.signals[n]:0;c.strokeStyle=power>=.12?'#73ffb0':'#86684c';c.lineWidth=power>=.12?.32:.22;c.beginPath();c.moveTo(x,y);if(x<W-1&&wire[k+1])c.lineTo(x+1,y);c.moveTo(x,y);if(y<machines.h-1&&wire[k+W])c.lineTo(x,y+1);c.stroke();c.fillStyle=c.strokeStyle;c.beginPath();c.arc(x,y,.13,0,Math.PI*2);c.fill();}
  const port=(x,y,p,label)=>{c.fillStyle='#101921';c.beginPath();c.arc(x,y,.55,0,Math.PI*2);c.fill();c.strokeStyle=p>=.12?'#89ffbc':'#d7b580';c.lineWidth=.2;c.beginPath();c.arc(x,y,.33,0,Math.PI*2);c.stroke();c.fillStyle=p>=.12?'#aaffd0':'#e5d4ba';c.font='bold .9px system-ui';c.textAlign='center';c.fillText(label,x,y-.9);};
  for(const r of machines.rotors)if(r){
    c.save();c.translate(r.x,r.y);c.rotate(r.angle);
    c.strokeStyle='#0a111a';c.lineWidth=1.5;c.beginPath();c.moveTo(-4,0);c.lineTo(4,0);c.moveTo(0,-4);c.lineTo(0,4);c.stroke();
    c.strokeStyle=r.power>=.12?'#c4f6eb':'#b8ced9';c.lineWidth=.8;c.stroke();c.restore();
    c.fillStyle='#17232e';c.beginPath();c.arc(r.x,r.y,.78,0,Math.PI*2);c.fill();c.strokeStyle='#e2b561';c.lineWidth=.22;c.stroke();
    c.fillStyle='#f7dba0';c.beginPath();c.arc(r.x,r.y,.20,0,Math.PI*2);c.fill();
    c.strokeStyle='#b4a27d';c.lineWidth=.18;c.beginPath();c.moveTo(r.x+.8,r.y);c.lineTo(r.x+5,r.y);c.stroke();port(r.x+5,r.y,r.power,'P');
    for(const sign of [-1,1]){const py=r.y+sign;c.strokeStyle='#b4a27d';c.lineWidth=.18;c.beginPath();c.moveTo(r.x-5,py);c.lineTo(r.x-1.2,py);c.stroke();port(r.x-5,py,machines.signal(r.x-5,py),sign<0?'M+':'M−');}
    c.font='bold 1px system-ui';c.textAlign='center';c.fillStyle='#cde8f1';c.fillText((Math.abs(r.drive||0)>.01?'MOTOR ':'')+Math.round(r.power*100)+'% · '+r.energy.toFixed(1)+' E',r.x,r.y+6);
  }
  for(const l of machines.lights)if(l){
    c.save();c.translate(l.x,l.y);if(l.on){const glow=c.createRadialGradient(0,0,.4,0,0,4);glow.addColorStop(0,'rgba(255,239,145,.55)');glow.addColorStop(1,'rgba(255,200,80,0)');c.fillStyle=glow;c.fillRect(-4,-4,8,8);}
    c.strokeStyle=l.on?'#fff1a3':'#8b8f98';c.lineWidth=.24;c.beginPath();c.moveTo(-3,0);c.lineTo(3,0);c.stroke();c.fillStyle=l.on?'#fff6b2':'#242630';c.beginPath();c.arc(0,0,1.5,0,Math.PI*2);c.fill();c.stroke();c.strokeStyle=l.on?'#c8892b':'#777c8a';c.lineWidth=.18;c.beginPath();c.moveTo(-.7,.5);c.lineTo(-.35,-.35);c.lineTo(.35,.35);c.lineTo(.7,-.5);c.stroke();c.restore();
    port(l.x-3,l.y,l.on?1:0,'');port(l.x+3,l.y,l.on?1:0,'');
  }
  for(const g of machines.gates){c.fillStyle='#161c30';c.strokeStyle='#a2a7d9';c.lineWidth=.2;c.beginPath();c.rect(g.x-2,g.y-2,4,4);c.fill();c.stroke();
    c.strokeStyle='#c0c5df';c.beginPath();c.moveTo(g.x-3,g.y-1);c.lineTo(g.x-2,g.y-1);c.moveTo(g.x-3,g.y+1);c.lineTo(g.x-2,g.y+1);c.moveTo(g.x+2,g.y);c.lineTo(g.x+3,g.y);c.stroke();
    c.fillStyle='#ebecff';c.textAlign='center';c.font='bold 1px system-ui';c.fillText('NAND',g.x,g.y+.35);
    port(g.x-3,g.y-1,g.a?1:0,'A');port(g.x-3,g.y+1,g.b?1:0,'B');port(g.x+3,g.y,machines.signal(g.x+3,g.y),'Q');
  }c.restore();
}
function drawCursor() {
  const c = octx, w = overlay.width, h = overlay.height;
  c.clearRect(0, 0, w, h);
  drawMachines(c,w/W,h/H);
  player.draw(c,w/W,h/H);
  if(player.active&&player.name){c.save();c.font='11px monospace';c.textAlign='center';c.fillStyle='#fff';c.shadowColor='#000';c.shadowBlur=4;c.fillText(player.name,player.x*w/W,(player.y-5.3)*h/H);c.restore();}
  if (!ptr.inside) return;
  const s = w / W, R = PEN_R[ui.pen] * s;
  const name = ptr.down && ptr.btn === 'R' ? ui.toolR : ui.toolL;
  const x = ptr.x * s, y = ptr.y * s;
  c.lineWidth = Math.max(1, s * 0.18);
  c.strokeStyle = name === 'erase' ? 'rgba(255,155,107,.9)' : 'rgba(255,255,255,.75)';
  c.beginPath();
  if(name==='player'){c.rect(x-.85*s,y-4.2*s,1.7*s,1.5*s);c.moveTo(x,y-2.7*s);c.lineTo(x,y-1.7*s);c.lineTo(x-.5*s,y);c.moveTo(x,y-1.7*s);c.lineTo(x+.5*s,y);}
  else if(name==='turbine'){c.moveTo(x-4*s,y);c.lineTo(x+4*s,y);c.moveTo(x,y-4*s);c.lineTo(x,y+4*s);}
  else if(name==='light'){c.arc(x,y,1.5*s,0,Math.PI*2);c.moveTo(x-3*s,y);c.lineTo(x+3*s,y);}
  else if(name==='gate'){c.rect(x-2*s,y-2*s,4*s,4*s);}
  else if(name==='wire'){const q=machines.snap(ptr.x,ptr.y);c.arc(q[0]*s,q[1]*s,.4*s,0,Math.PI*2);}
  else if (name === 'wind') { c.setLineDash([s * 0.6, s * 0.6]); c.arc(x, y, (PEN_R[ui.pen] * 1.5 + 2) * s, 0, Math.PI * 2); }
  else c.arc(x, y, Math.max(R, s * 0.5), 0, Math.PI * 2);
  c.stroke(); c.setLineDash([]);
  c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(x - 1, y - 1, 2, 2);
}

// loop
let last = performance.now(), acc = 0, fpsT = last, fpsN = 0, shaking = false, kernelShown = false;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now) {
  if(projectBusy){last=now;requestAnimationFrame(tick);return;}
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let steps = 0;
  if (ui.running) { acc += dt * STEP_HZ * SPEEDS[ui.speed][0]; steps = Math.floor(acc); acc -= steps; steps = Math.min(steps, sim.kind === 'CPU' ? 3 : 10); }
  const tool = applyInput(steps);
  try { sim.frame(steps, tool, ui.view); } catch (err) { showMsg('<b>render error:</b> ' + err.message); throw err; }
  if (sim.lost) showMsg('<b>GPU device lost</b> — reload the page to restart');
  machines.advance(steps);
  if(player.death){showMsg('Player died · Select Player to place another.');player.death=false;}
  drawCursor();
  const fl = sim.flash || 0;
  if (fl > 0.12 && !reduceMotion) { const k = fl * 5; stage.style.transform = `translate(${(Math.random() - 0.5) * k}px, ${(Math.random() - 0.5) * k}px)`; shaking = true; }
  else if (shaking) { stage.style.transform = ''; shaking = false; }
  fpsN++;
  if (now - fpsT > 500) {
    $('s-fps').textContent = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now;
    $('s-n').textContent = sim.count.toLocaleString('en-US');
    if (sim.tune && sim.tune.phase === 2 && !kernelShown) { kernelShown = true;
      $('s-be').innerHTML += ' &middot; <span class="v">' + sim.tune.pick + '</span> kernel'; }
  }
  requestAnimationFrame(tick);
}
function showMsg(h) { $('msg').innerHTML = h; }
let hintShown = false;

async function boot() {
  layout();
  try {
    sim = await GpuSim.create(view);
    $('s-be').innerHTML = 'WebGPU &middot; <span class="v">' + (MAXP_GPU / 1024) + 'k</span> cap';
  } catch (err) {
    console.warn('WebGPU path failed, using CPU:', err);
    const fresh = document.createElement('canvas'); fresh.id = 'view'; view.replaceWith(fresh); view = fresh; layout();
    sim = new CpuSim(view);
    $('s-be').innerHTML = 'CPU fallback &middot; <span class="v">12k</span> cap';
    const reason = String(err && err.message || err);
    $('s-be').title = reason;
    $('msg').textContent = navigator.gpu
      ? 'CPU mode · GPU startup failed: ' + reason.split('\n')[0].slice(0,220)
      : 'CPU mode · WebGPU is not available in this page; running on CPU.';
  }
  if (sim.kind === 'GPU') { showMsg('Drag to pour &middot; right-drag erases &middot; choose an element to begin'); hintShown = true; }
  refreshUI(); clearAll(); layout();
  window.__slurry = { get sim() { return sim; }, ui, occ, player, projects: createSlurryProjectBridge() };
  window.dispatchEvent(new Event('slurry-ready'));
  if (!window.__noAuto) requestAnimationFrame(t => { last = t; tick(t); });
}
boot();
</script>
